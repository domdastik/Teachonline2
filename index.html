<script>
(function(){
/* =====================================================================

var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCltzt0IusYUuG248DZLQeVMYjn1UtPEco",
  authDomain: "school-24da7.firebaseapp.com",
  projectId: "school-24da7",

  messagingSenderId: "931185987043",

};
/* ===================================================================== */

var TYPES=['test','assignment','exam'];
var DEFAULT_W={test:30,assignment:20,exam:50};
var roster={}, subjects={}, entries={}, weights=Object.assign({},DEFAULT_W), names={}, allowed={}, schedules={};
var DEFAULT_TIMES=['08:00','08:50','09:40','10:30','11:20','12:10'];
var periodTimes=DEFAULT_TIMES.slice();
var DEFAULT_BREAKS=[{id:'b1',label:'Break 1',start:'09:40',end:'09:55'},{id:'b2',label:'Lunch',start:'11:35',end:'12:15'},{id:'b3',label:'Break 3',start:'13:55',end:'14:10'}];
var breaks=DEFAULT_BREAKS.map(function(b){return Object.assign({},b)});
var holidays={}, ttTeacher='';
var subUnsubs={}, chains={}, assignments={}, asgCode='', asgOpen=null;
var classes={}, announcements={}, clsOpen=null, clsAssignFor=null, newClsTeacher=null;
var roles={}, adminsMap={}, myRole='', myPerms={}, accOpen=null;
var years={}, currentYearId='';
var activity={};
var PERM_KEYS=['students','subjects','classes','schedule','holidays','announcements','viewTimetables'];
var PERM_LABELS={students:'Manage students (add, edit, delete)',subjects:'Manage subjects & teacher assignment',classes:'Manage classes & form teacher assignment',schedule:'Edit class schedules, periods & breaks',holidays:'Edit holidays & events',announcements:'Post announcements',viewTimetables:'View any teacher\u2019s personal timetable'};
var db=null,auth=null,myId=null,myName='',myEmail='',isAdmin=false,started=false;
var tab='students',sel=null,filter='',mineOnly=null,banner='',assignFor=null,newTeacher=null,report=null,rcCode=null,rcDate=new Date().toISOString().slice(0,10),schoolName='School Records',schLevel='';

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function genSubjectCode(name){
  var words=(name||'').toUpperCase().replace(/[^A-Z0-9\s]/g,'').trim().split(/\s+/).filter(Boolean);
  var base=words.length>1?words.map(function(w){return w[0]}).join('').slice(0,4):(words[0]||'SUB').slice(0,4);
  if(base.length<2)base='SUB';
  var code,tries=0;
  do{code=base+String(100+Math.floor(Math.random()*900));tries++}while(subjects[code]&&tries<50);
  return code;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function today(){return new Date().toISOString().slice(0,10)}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function fmt(v){return v==null?'\u2013':v.toFixed(1)+'%'}
function cls(v){return v==null?'':v>=70?'g-ok':v>=50?'g-mid':'g-bad'}
function tname(id){return id?((names[id]&&names[id].name)||'Teacher'):'Unassigned'}
function ageFrom(dob){if(!dob)return null;var d=new Date(dob+'T00:00:00');if(isNaN(d))return null;var now=new Date(),age=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth();if(m<0||(m===0&&now.getDate()<d.getDate()))age--;return age>=0?age:null}
function pill(v){return '<span class="chip '+cls(v)+'">'+fmt(v)+'</span>'}
function bar(v){return '<div class="bar"><i style="width:'+(v==null?0:Math.max(0,Math.min(100,v)))+'%"></i></div>'}
function av(name,sz){var n=(name||'?').trim(),p=n.split(/\s+/),ini=((p[0]||'?')[0]+((p.length>1?p[p.length-1][0]:'')||'')).toUpperCase(),hue=0;for(var i=0;i<n.length;i++)hue=(hue*31+n.charCodeAt(i))%360;sz=sz||32;
  return '<span class="avatar" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.4)+'px;background:hsl('+hue+',60%,62%)">'+esc(ini)+'</span>'}
function K(sid,code){return sid+'_'+code}
function saveFile(filename,data,mime){
  try{var blob=new Blob([data],{type:mime||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},1000)}
  catch(e){banner='Could not start the download in this browser.';draw()}
}

/* ---------- data helpers ---------- */
function enrolled(sid){return ((roster[sid]&&roster[sid].subjects)||[]).filter(function(c){return subjects[c]})}
function entryFor(tid,sid,code){return (entries[tid]&&entries[tid][K(sid,code)])||null}
/* An entry only counts if it sits in the subtree of the teacher the owner assigned to that code. */
function validEntry(sid,code){
  var sub=subjects[code];if(!sub||!sub.teacherId)return null;
  if(enrolled(sid).indexOf(code)<0)return null;
  return entryFor(sub.teacherId,sid,code)||{grades:[],absences:[]};
}
function subjectAvg(sid,code){
  var e=validEntry(sid,code);if(!e)return null;
  var g=(e.grades||[]).filter(function(x){return +x.max>0&&x.score!==''&&x.score!=null&&inCurrentYear(x)});
  if(!g.length)return null;
  var num=0,den=0;
  TYPES.forEach(function(t){
    var m=mean(g.filter(function(x){return x.type===t}).map(function(x){return +x.score/+x.max*100}));
    var w=+weights[t]||0;if(m!=null&&w>0){num+=m*w;den+=w}
  });
  return den>0?num/den:mean(g.map(function(x){return +x.score/+x.max*100}));
}
function inCurrentYear(x){if(!currentYearId)return true;if(!x.year)return true;return x.year===currentYearId}
function overall(sid){return mean(enrolled(sid).map(function(c){return subjectAvg(sid,c)}).filter(function(x){return x!=null}))}
function absTotal(sid,unexc){
  var n=0;enrolled(sid).forEach(function(c){var e=validEntry(sid,c);if(e)(e.absences||[]).forEach(function(a){if(inCurrentYear(a)&&(!unexc||!a.excused))n++})});return n;
}
function myCodes(){return Object.keys(subjects).filter(function(c){return myId&&subjects[c].teacherId===myId})}
function canEditSub(code){var s=subjects[code];return !!(s&&s.teacherId&&(isAdmin||s.teacherId===myId))}
function can(cap){return !!(isAdmin||(myRole==='management'&&myPerms&&myPerms[cap]))}
function roleOf(uid){return adminsMap[uid]?'admin':((roles[uid]&&roles[uid].role)||'teacher')}
function canEditClass(level){var c=classes[level];return !!(level&&(can('classes')||(c&&c.formTeacherId===myId)))}
function moveStudentToClass(id,newLevel){var s=clone(roster[id]);s.level=newLevel;roster[id]=s;put('roster/'+id,s);render()}

/* ---------- writes ---------- */
function fail(e){banner='Save refused: '+((e&&e.message)||e)+' (you can only change data for your own subjects).';render()}
function put(path,data){chains[path]=(chains[path]||Promise.resolve()).then(function(){return db.doc(path).set(data)}).catch(fail)}
function del(path){chains[path]=(chains[path]||Promise.resolve()).then(function(){return db.doc(path).delete()}).catch(fail)}
function mutateEntry(sid,code,fn){
  if(!canEditSub(code)){banner='You cannot edit '+code+'.';render();return}
  var tid=subjects[code].teacherId,cur=entryFor(tid,sid,code);
  var e=cur?clone(cur):{student:sid,subject:code,grades:[],absences:[]};
  e.grades=e.grades||[];e.absences=e.absences||[];fn(e);
  entries[tid]=entries[tid]||{};entries[tid][K(sid,code)]=e;
  put('marks/'+tid+'/entries/'+K(sid,code),clone(e));render();
}
function saveRoster(id){put('roster/'+id,clone(roster[id]))}
function logActivity(action,summary){if(!isAdmin)return;var id=uid();put('activity/'+id,{ts:Date.now(),actorId:myId,action:action,summary:summary})}
function assignmentGrade(sid,code,aid){var e=validEntry(sid,code);if(!e)return null;return (e.grades||[]).filter(function(g){return g.assignmentId===aid})[0]||null}
function setAssignmentMark(sid,code,a,status,score){
  mutateEntry(sid,code,function(en){
    var g=en.grades.filter(function(x){return x.assignmentId===a.id})[0];
    if(!g){g={id:uid(),assignmentId:a.id,type:a.type,title:a.title,date:a.dueDate||today(),score:'',max:a.points,status:'missing',year:currentYearId||null};en.grades.push(g)}
    g.max=a.points;g.type=a.type;g.title=a.title;
    if(status!=null)g.status=status;
    if(score!=null)g.score=score;
  });
}

/* ---------- auth & subscriptions ---------- */
function isConfigured(){return FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey.indexOf('PASTE_')!==0}
function getWithRetry(path,tries){
  tries=tries||5;
  return db.doc(path).get().catch(function(e){
    if(tries>1&&/offline/i.test((e&&e.message)||'')){
      return new Promise(function(res){setTimeout(res,800)}).then(function(){return getWithRetry(path,tries-1)});
    }
    throw e;
  });
}
function syncTeacherSubs(){
  var want={};Object.keys(subjects).forEach(function(c){if(subjects[c].teacherId)want[subjects[c].teacherId]=1});
  Object.keys(subUnsubs).forEach(function(t){if(!want[t]){subUnsubs[t]();delete subUnsubs[t];delete entries[t]}});
  Object.keys(want).forEach(function(t){
    if(subUnsubs[t])return;
    subUnsubs[t]=db.collection('marks/'+t+'/entries').onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){m[d.id]=clone(d.data())});entries[t]=m;render();
    },function(){});
  });
}
function startApp(){
  if(started)return;started=true;
  document.getElementById('csv').hidden=false;document.getElementById('menuBtn').hidden=false;
  if(isAdmin){
    db.collection('allowed_emails').onSnapshot(function(s){var n={};s.docs.forEach(function(d){n[d.id]=true});allowed=n;draw()},function(){});
    db.collection('admins').onSnapshot(function(s){var n={};s.docs.forEach(function(d){n[d.id]=true});adminsMap=n;draw()},function(){});
    db.collection('roles').onSnapshot(function(s){var n={};s.docs.forEach(function(d){n[d.id]=clone(d.data())});roles=n;myRole=(n[myId]&&n[myId].role)||'';myPerms=(n[myId]&&n[myId].perms)||{};draw()},function(){});
    db.collection('activity').onSnapshot(function(s){var n={};s.docs.forEach(function(d){n[d.id]=clone(d.data())});activity=n;draw()},function(){});
  }else{
    db.doc('roles/'+myId).onSnapshot(function(d){if(d.exists){var rd=clone(d.data());roles[myId]=rd;myRole=rd.role||'';myPerms=rd.perms||{}}else{myRole='';myPerms={}}draw()},function(){});
  }
  db.collection('users').onSnapshot(function(s){var n={};s.docs.forEach(function(d){n[d.id]=clone(d.data())});names=n;draw()},function(){});
  db.collection('roster').onSnapshot(function(s){var n={};s.docs.forEach(function(d){n[d.id]=clone(d.data())});roster=n;if(sel&&!roster[sel])sel=null;if(report&&!roster[report])report=null;draw()},function(e){banner='Cannot read records ('+(e&&e.code)+').';draw()});
  db.collection('subjects').onSnapshot(function(s){var n={};s.docs.forEach(function(d){n[d.id]=clone(d.data())});subjects=n;syncTeacherSubs();draw()},function(){});
  db.doc('config/weights').onSnapshot(function(d){if(d.exists)weights=Object.assign({},DEFAULT_W,clone(d.data()));draw()},function(){});
  db.doc('config/school').onSnapshot(function(d){if(d.exists&&d.data().name)schoolName=String(d.data().name);draw()},function(){});
  db.doc('config/periods').onSnapshot(function(d){if(d.exists&&Array.isArray(d.data().times)&&d.data().times.length)periodTimes=d.data().times;draw()},function(){});
  db.doc('config/breaks').onSnapshot(function(d){if(d.exists&&Array.isArray(d.data().list)&&d.data().list.length)breaks=d.data().list;draw()},function(){});

    return;
  }
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();db.settings({experimentalForceLongPolling:true,useFetchStreams:false});auth=firebase.auth()}
  catch(e){document.getElementById('app').innerHTML='<div class="banner">Could not start Firebase: '+esc(e&&e.message||e)+'. Double check FIREBASE_CONFIG.</div>';return}
  auth.onAuthStateChanged(function(u){
    started=false;
    if(!u){myId=null;isAdmin=false;showGate();return}
    myId=u.uid;myName=u.displayName||u.email||'Signed in';myEmail=(u.email||'').toLowerCase();
    getWithRetry('allowed_emails/'+myEmail).then(function(ad){

      db.doc('admins/'+myId).onSnapshot(function(d){isAdmin=!!d.exists;startApp()},function(){isAdmin=false;startApp()});

var SCHED_DAYS=[['MO','Mon'],['TU','Tue'],['WE','Wed'],['TH','Thu'],['FR','Fri']];
/* Periods and breaks are stored completely separately (so adding/editing a

function scheduleRows(){
  var rows=periodTimes.map(function(t,pi){return {kind:'period',time:t,pi:pi}});
  breaks.forEach(function(b){rows.push({kind:'break',time:b.start,b:b})});

}
function breakRow(b){return '<tr class="brk"><td class="mut">'+esc(b.start)+'\u2013'+esc(b.end)+'</td><td colspan="5" style="text-align:center">'+esc(b.label)+'</td></tr>'}

  var h='<div class="card"><h2><span class="code">'+esc(code)+'</span> '+esc(sub.name)+' <span style="float:right">'+pill(avv)+'</span></h2><p class="lock">'+(sub.teacherId?'Teacher: '+esc(tname(sub.teacherId)):'No teacher assigned')+' \u00b7 '+(ed?'you can edit':'read only')+'</p>';
  h+=(ed?'<input data-cm="1" data-code="'+esc(code)+'" value="'+esc(e.comment)+'" placeholder="Teacher comment (shown on the report)" style="width:100%;margin-bottom:10px">':(e.comment?'<p class="mut" style="margin-top:0">\u201c'+esc(e.comment)+'\u201d</p>':''));
  if(ed){
    h+='<div class="row" style="margin-bottom:8px"><select id="gt-'+esc(code)+'" data-keep>'+TYPES.map(function(t){return '<option>'+t+'</option>'}).join('')+'</select><input id="gn-'+esc(code)+'" data-keep placeholder="Title"><input id="gs-'+esc(code)+'" data-keep type="number" step="any" placeholder="Score" style="max-width:80px"><input id="gm-'+esc(code)+'" data-keep type="number" step="any" placeholder="Out of" value="100" style="max-width:80px"><button class="p" data-act="addGrade" data-code="'+esc(code)+'">Add</button></div>';
  }
  h+='<div class="scroll"><table><tr><th>Type</th><th>Title</th><th>Score</th><th>Out of</th><th>%</th><th></th></tr>';
  var gShown=0;
  (e.grades||[]).forEach(function(g,i){if(!inCurrentYear(g))return;gShown++;var p=+g.max>0&&g.score!==''?+g.score/+g.max*100:null;
    h+='<tr><td>'+esc(g.type)+'</td>'+(ed?'<td><input data-g="'+i+'" data-code="'+esc(code)+'" data-k="title" value="'+esc(g.title)+'"></td><td><input class="n" type="number" step="any" data-g="'+i+'" data-code="'+esc(code)+'" data-k="score" value="'+esc(g.score)+'"></td><td><input class="n" type="number" step="any" data-g="'+i+'" data-code="'+esc(code)+'" data-k="max" value="'+esc(g.max)+'"></td>':'<td>'+esc(g.title)+'</td><td>'+esc(g.score)+'</td><td>'+esc(g.max)+'</td>')+'<td>'+pill(p)+'</td><td>'+(ed?'<button class="x" data-act="delGrade" data-code="'+esc(code)+'" data-i="'+i+'">&times;</button>':'')+'</td></tr>'});
  if(!gShown)h+='<tr><td colspan="6" class="mut">No grades recorded'+(currentYearId?' for '+esc((years[currentYearId]||{}).label||'this year'):'')+'.</td></tr>';
  h+='</table></div><h2 style="margin-top:14px">Absences</h2>';
  if(ed)h+='<div class="row" style="margin-bottom:8px"><input id="ad-'+esc(code)+'" data-keep type="date" value="'+today()+'" style="flex:0 0 auto"><input id="an-'+esc(code)+'" data-keep placeholder="Note"><label class="mut"><input id="ae-'+esc(code)+'" data-keep type="checkbox" style="width:auto"> excused</label><button class="p" data-act="addAbsence" data-code="'+esc(code)+'">Add</button></div>';
  h+='<div class="scroll"><table><tr><th>Date</th><th>Note</th><th>Excused</th><th></th></tr>';
  var aShown=0;
  (e.absences||[]).map(function(x,i){return {x:x,i:i}}).sort(function(p,q){return q.x.date<p.x.date?-1:1}).forEach(function(o){
    if(!inCurrentYear(o.x))return;aShown++;
    h+='<tr><td>'+esc(o.x.date)+'</td><td>'+esc(o.x.note)+'</td><td>'+(ed?'<input type="checkbox" style="width:auto" data-ex="'+o.i+'" data-code="'+esc(code)+'"'+(o.x.excused?' checked':'')+'>':(o.x.excused?'yes':'no'))+'</td><td>'+(ed?'<button class="x" data-act="delAbsence" data-code="'+esc(code)+'" data-i="'+o.i+'">&times;</button>':'')+'</td></tr>'});
  if(!aShown)h+='<tr><td colspan="4" class="mut">No absences recorded'+(currentYearId?' for '+esc((years[currentYearId]||{}).label||'this year'):'')+'.</td></tr>';
  return h+'</table></div></div>';
}

/* ---------- roll call ---------- */
function byName(a,b){return (roster[a].name||'').localeCompare(roster[b].name||'')}
function dayCodeFor(dateStr){var d=new Date(dateStr+'T00:00:00');if(isNaN(d))return null;return ['SU','MO','TU','WE','TH','FR','SA'][d.getDay()]}
function myLessonsForDay(teacherId,dayCode){
  if(!dayCode)return [];
  var tgrid=myTimetableFor(teacherId),out=[];
  scheduleRows().forEach(function(r){if(r.kind!=='period')return;var hit=tgrid[dayCode+'-'+r.pi];if(hit)out.push({pi:r.pi,time:r.time,level:hit.level,code:hit.code})});
  return out;
}
function rollView(){
  var dayCode=dayCodeFor(rcDate),weekend=dayCode==='SA'||dayCode==='SU';
  var lessons=isAdmin?[]:myLessonsForDay(myId,dayCode);
  if(isAdmin){
    var allCodes=Object.keys(subjects).sort();
    if(!allCodes.length)return '<div class="card"><p class="mut" style="margin:0">Create a subject code first.</p></div>';
    if(!rcCode||allCodes.indexOf(rcCode)<0)rcCode=allCodes[0];
  }else if(!lessons.length){
    rcCode=null;
  }else if(!rcCode||!lessons.some(function(l){return l.code===rcCode})){
    rcCode=lessons[0].code;
  }
  var h='<div class="card"><h2>Roll call</h2><div class="row"><input type="date" id="rcDate" value="'+esc(rcDate)+'" style="flex:0 0 auto">';
  if(isAdmin)h+='<select id="rcSub">'+Object.keys(subjects).sort().map(function(c){return '<option value="'+esc(c)+'"'+(c===rcCode?' selected':'')+'>'+esc(c)+' \u00b7 '+esc(subjects[c].name)+'</option>'}).join('')+'</select>';
  h+='</div>';
  if(!isAdmin){
    if(weekend)h+='<p class="mut" style="margin:10px 0 0">No lessons \u2014 it\u2019s the weekend.</p>';
    else if(!lessons.length)h+='<p class="mut" style="margin:10px 0 0">You have no lessons on your timetable for this day. Check the Timetable tab, or ask the owner to fill in the Schedule.</p>';
    else h+='<div class="row" style="margin-top:10px">'+lessons.map(function(l){return '<button data-act="pickLesson" data-code="'+esc(l.code)+'"'+(l.code===rcCode?' class="p"':'')+'>'+esc(l.time)+' \u00b7 '+esc(l.code)+' \u00b7 '+esc(l.level)+'</button>'}).join('')+'</div>';
  }
  if(rcCode)h+='<div class="row" style="margin-top:10px"><button data-act="rcAll" data-code="'+esc(rcCode)+'">All present</button></div>';
  h+='</div>';
  if(rcCode){
    var ids=Object.keys(roster).filter(function(id){return enrolled(id).indexOf(rcCode)>-1}).sort(byName);
    var cnt={present:0,absent:0,excused:0},rows='';
    ids.forEach(function(id){
      var e=validEntry(id,rcCode)||{absences:[]},rec=(e.absences||[]).filter(function(a){return a.date===rcDate})[0];
      var st=!rec?'present':(rec.excused?'excused':'absent');cnt[st]++;
      rows+='<div class="rc-row"><div class="who">'+av(roster[id].name)+'<span>'+esc(roster[id].name)+'</span></div><div class="seg">'+
        ['present','absent','excused'].map(function(s){return '<button data-act="rc" data-sid="'+esc(id)+'" data-code="'+esc(rcCode)+'" data-state="'+s+'" class="'+(st===s?'on-'+s:'')+'">'+s.charAt(0).toUpperCase()+s.slice(1)+'</button>'}).join('')+'</div></div>';
    });
    h+='<div class="card"><div class="row" style="margin-bottom:10px"><span class="chip g-ok">'+cnt.present+' present</span><span class="chip g-bad">'+cnt.absent+' absent</span><span class="chip g-mid">'+cnt.excused+' excused</span></div>'+(rows||'<p class="mut" style="margin:0">No students are enrolled in this subject yet.</p>')+'</div>';
  }
  return h;
}

function runSearchCls(q){
  var box=document.getElementById('cres');if(!box)return;
  box.textContent='';

  if(!hits.length){var p=document.createElement('p');p.className='mut';p.textContent=q?'No matches.':'No one has signed in yet.';box.appendChild(p);return}
  hits.forEach(function(id){var b=document.createElement('button');b.dataset.act='pickClsTeacherResult';b.dataset.pid=id;b.textContent=names[id].name||names[id].email||id;box.appendChild(b)});

  var people={};

  Object.keys(subjects).forEach(function(c){var t=subjects[c].teacherId;if(t){people[t]=people[t]||{subjects:[],classes:[]};people[t].subjects.push(c)}});
  Object.keys(classes).forEach(function(lv){var t=classes[lv].formTeacherId;if(t){people[t]=people[t]||{subjects:[],classes:[]};people[t].classes.push(lv)}});
  var ids=Object.keys(people).sort(function(a,b){return tname(a).localeCompare(tname(b))});
  var h='<div class="card"><h2>Teachers</h2><div class="scroll"><table><tr><th>Name</th><th>Subjects</th><th>Form class</th></tr>';
  ids.forEach(function(id){var p=people[id];
    h+='<tr><td><div class="who">'+av(tname(id))+esc(tname(id))+(id===myId?' <span class="mut">(you)</span>':'')+'</div></td><td>'+(p.subjects.length?p.subjects.sort().map(function(c){return '<span class="code">'+esc(c)+'</span>'}).join(' '):'<span class="mut">none</span>')+'</td><td>'+(p.classes.length?esc(p.classes.sort().join(', ')):'<span class="mut">none</span>')+'</td></tr>'});
  if(!ids.length)h+='<tr><td colspan="3" class="mut">No one has signed in yet.</td></tr>';
  h+='</table></div></div>';
  return h;
}

/* ---------- student report ---------- */
var REPORT_CSS='.rp-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #3b82f6;padding-bottom:10px;margin-bottom:14px}.rp-school{font-size:20px;font-weight:800;color:#2563eb}.rp-name{margin:4px 0 2px;font-size:22px}.rp-table{width:100%;border-collapse:collapse;margin:8px 0 16px}.rp-table th,.rp-table td{border-bottom:1px solid #e4ebf4;padding:7px 6px;text-align:left;font-size:13.5px}.rp-table th{font-size:11px;text-transform:uppercase;color:#6f8097;letter-spacing:.04em}.rp-sub{margin:16px 0 4px;font-size:15px;font-weight:700}.rp-cm{background:#f3f7fc;border-left:3px solid #3b82f6;padding:8px 10px;margin:6px 0;font-size:13.5px}.rp-sign{display:flex;gap:30px;margin-top:40px}.rp-sign div{flex:1;border-top:1px solid #6f8097;padding-top:4px;font-size:12px;color:#6f8097}.rp-mut{color:#6f8097;font-size:13px}';
document.getElementById('rpcss').textContent=REPORT_CSS;
function remark(v){return v==null?'\u2013':v>=85?'Excellent':v>=70?'Good':v>=50?'Satisfactory':'Needs support'}
function reportBody(sid){
  var s=roster[sid],en=enrolled(sid).sort(),a=overall(sid);
  var h='<div class="rp-head"><div><div class="rp-school">'+esc(schoolName)+'</div><div class="rp-mut">Student progress report</div></div><div class="rp-mut" style="text-align:right">Issued '+esc(today())+'</div></div>';
  var rAge=ageFrom(s.dob);h+='<h2 class="rp-name">'+esc(s.name)+'</h2><p class="rp-mut" style="margin:0 0 10px">Class '+esc(s.level||'\u2013')+(rAge!=null?' \u00b7 age '+rAge:'')+(s.career?' \u00b7 aspiring '+esc(s.career):'')+'</p><p class="rp-mut" style="margin:0 0 10px">Overall average <b>'+fmt(a)+'</b> ('+remark(a)+') \u00b7 Absences '+absTotal(sid)+' ('+absTotal(sid,true)+' unexcused)'+(s.email?' \u00b7 '+esc(s.email):'')+'</p>';
  h+='<table class="rp-table"><tr><th>Code</th><th>Subject</th><th>Teacher</th><th>Average</th><th>Absences</th><th>Result</th></tr>';
  en.forEach(function(c){var v=subjectAvg(sid,c),e=validEntry(sid,c)||{absences:[]};
    h+='<tr><td><b>'+esc(c)+'</b></td><td>'+esc(subjects[c].name)+'</td><td>'+esc(tname(subjects[c].teacherId))+'</td><td>'+fmt(v)+'</td><td>'+(e.absences||[]).filter(inCurrentYear).length+'</td><td>'+remark(v)+'</td></tr>'});
  if(!en.length)h+='<tr><td colspan="6" class="rp-mut">No subjects assigned.</td></tr>';
  h+='</table>';
  en.forEach(function(c){var e=validEntry(sid,c)||{grades:[],absences:[]},eg=(e.grades||[]).filter(inCurrentYear),ea=(e.absences||[]).filter(inCurrentYear);
    h+='<div class="rp-sub">'+esc(c)+' \u00b7 '+esc(subjects[c].name)+'</div>';
    if(eg.length){h+='<table class="rp-table"><tr><th>Assessment</th><th>Type</th><th>Score</th><th>%</th></tr>'+eg.map(function(g){var p=+g.max>0&&g.score!==''?+g.score/+g.max*100:null;return '<tr><td>'+esc(g.title)+'</td><td>'+esc(g.type)+'</td><td>'+esc(g.score)+' / '+esc(g.max)+'</td><td>'+fmt(p)+'</td></tr>'}).join('')+'</table>'}
    else h+='<p class="rp-mut" style="margin:2px 0">No grades recorded.</p>';
    if(ea.length)h+='<p class="rp-mut" style="margin:2px 0">Absent: '+ea.slice().sort(function(x,y){return x.date<y.date?-1:1}).map(function(x){return esc(x.date)+(x.excused?' (excused)':'')}).join(', ')+'</p>';
    if(e.comment)h+='<div class="rp-cm">'+esc(e.comment)+' <span class="rp-mut">\u2014 '+esc(tname(subjects[c].teacherId))+'</span></div>';
  });
  h+='<div class="rp-sign"><div>Class teacher</div><div>Head teacher</div><div>Parent / guardian</div></div>';
  return h;
}
function reportView(sid){
  return '<div class="row noprint" style="margin-bottom:12px"><button class="p" data-act="print">Print / save as PDF</button><button data-act="dlReport">Download report</button></div><div class="card report">'+reportBody(sid)+'</div>';

function dlReport(sid){

/* ---------- events ---------- */
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
document.getElementById('back').onclick=function(){if(report){report=null;draw();return}sel=null;draw()};
function closeMenu(){document.getElementById('sidenav').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}

document.getElementById('tabs').addEventListener('click',function(e){var t=e.target.closest('[data-tab]');if(!t)return;tab=t.dataset.tab;sel=null;report=null;clsOpen=null;clsAssignFor=null;accOpen=null;banner='';draw();closeMenu()});
var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,code=t.dataset.code,i=+t.dataset.i;
  if(act==='open'){sel=t.dataset.id;banner='';draw();window.scrollTo(0,0);return}

  /* ---- subjects (create codes, assign teacher) ---- */
  if(act==='pickTeacher'){
    if(!can('subjects'))return;
    if(assignFor==='new')newTeacher=t.dataset.pid;
    else if(subjects[assignFor]){var s=clone(subjects[assignFor]);s.teacherId=t.dataset.pid;subjects[assignFor]=s;put('subjects/'+assignFor,s)}

  if(act==='pickNew'){if(!can('subjects'))return;assignFor='new';draw();openPicker();return}

    if(dup){banner='A subject named "'+n+'" already exists (code '+dup+').';draw();return}
    var c=genSubjectCode(n);
    subjects[c]={code:c,name:n,teacherId:newTeacher||myId};put('subjects/'+c,clone(subjects[c]));newTeacher=null;banner='';
    document.getElementById('sName').value='';syncTeacherSubs();render();return}
  if(act==='delSubject'){if(!can('subjects'))return;if(confirm('Delete subject '+code+'? Marks stay stored but stop counting.')){logActivity('delete','Deleted subject '+code+' ('+(subjects[code]||{}).name+')');delete subjects[code];del('subjects/'+code);syncTeacherSubs();render()}return}

  /* ---- classes (create, assign form teacher, or a form teacher's own roster edit) ---- */
  if(act==='openClass'){clsOpen=(clsOpen===t.dataset.level)?null:t.dataset.level;draw();return}
  if(act==='clsAdd'){if(!canEditClass(t.dataset.level))return;var cp=document.getElementById('clsPick');if(!cp||!cp.value)return;moveStudentToClass(cp.value,t.dataset.level);return}
  if(act==='clsRemove'){if(!canEditClass(clsOpen))return;moveStudentToClass(t.dataset.id,'');return}
  if(act==='pickClsTeacher'){if(!can('classes'))return;clsAssignFor='new';draw();openClsPicker();return}
  if(act==='clsTeacherBtn'){if(!can('classes'))return;clsAssignFor=t.dataset.level;draw();openClsPicker();return}
  if(act==='cancelClsPick'){clsAssignFor=null;draw();return}
  if(act==='pickClsTeacherResult'){
    if(!can('classes'))return;
    if(clsAssignFor==='new')newClsTeacher=t.dataset.pid;
    else if(classes[clsAssignFor]){var cc=clone(classes[clsAssignFor]);cc.formTeacherId=t.dataset.pid;classes[clsAssignFor]=cc;put('classes/'+clsAssignFor,cc)}
    clsAssignFor=null;render();return}
  if(act==='addClass'){if(!can('classes'))return;var cn=val('clsName');if(!cn)return;if(classes[cn]){banner='Class '+cn+' already exists.';draw();return}
    var cobj={name:cn,formTeacherId:newClsTeacher||null};classes[cn]=cobj;put('classes/'+cn,clone(cobj));newClsTeacher=null;document.getElementById('clsName').value='';banner='';render();return}
  if(act==='delClass'){if(!can('classes'))return;if(confirm('Delete class '+t.dataset.level+'? Students keep their class label but it stops appearing here until recreated.')){var dl=t.dataset.level;logActivity('delete','Deleted class '+dl);delete classes[dl];if(clsOpen===dl)clsOpen=null;del('classes/'+dl);render()}return}

  /* ---- announcements ---- */
  if(act==='addAnnouncement'){if(!can('announcements'))return;var atitle2=val('anTitle'),abody=val('anBody');if(!atitle2||!abody)return;
    var an={title:atitle2,body:abody,authorId:myId,createdAt:Date.now()};var anid=uid();announcements[anid]=an;put('announcements/'+anid,clone(an));
    document.getElementById('anTitle').value='';document.getElementById('anBody').value='';banner='';render();return}
  if(act==='delAnnouncement'){if(!can('announcements'))return;if(confirm('Delete this announcement?')){var dlid=t.dataset.id;logActivity('delete','Deleted announcement "'+((announcements[dlid]||{}).title||'')+'"');delete announcements[dlid];del('announcements/'+dlid);render()}return}

  /* ---- schedule & holidays ---- */
  if(act==='addBreak'){if(!can('schedule'))return;breaks=breaks.concat([{id:uid(),label:'Break',start:'10:00',end:'10:15'}]);put('config/breaks',{list:clone(breaks)});render();return}
  if(act==='delBreak'){if(!can('schedule'))return;breaks=breaks.filter(function(x,idx){return idx!==i});put('config/breaks',{list:clone(breaks)});render();return}
  if(act==='saveTimes'){if(!can('schedule'))return;var praw=val('periodTimes'),parr=praw.split(',').map(function(x){return x.trim()}).filter(Boolean);if(!parr.length)return;periodTimes=parr;put('config/periods',{times:parr});render();return}
  if(act==='addHoliday'){if(!can('holidays'))return;var hd=val('hDate'),htl=val('hTitle');if(!hd||!htl)return;
    var hobj={date:hd,title:htl,type:(document.getElementById('hType')||{}).value||'holiday'};var hid=uid();holidays[hid]=hobj;put('holidays/'+hid,clone(hobj));
    document.getElementById('hTitle').value='';render();return}
  if(act==='delHoliday'){if(!can('holidays'))return;if(confirm('Delete this entry?')){var dhid=t.dataset.id;delete holidays[dhid];del('holidays/'+dhid);render()}return}

  /* ---- assignments (owned by the subject's teacher, or admin) ---- */
  if(act==='openAssignment'){asgOpen=(asgOpen===t.dataset.id)?null:t.dataset.id;draw();return}
  if(act==='delAssignment'){var da=assignments[t.dataset.id];if(!da||!(isAdmin||da.teacherId===myId))return;if(confirm('Delete this assignment? Scores already entered stay on student records.')){var aid=t.dataset.id;delete assignments[aid];if(asgOpen===aid)asgOpen=null;del('assignments/'+aid);render()}return}
  if(act==='addAssignment'){
    if(!canEditSub(asgCode)){banner='You cannot add assignments to '+asgCode+'.';draw();return}
    var atitle=val('aTitle');if(!atitle)return;
    var na={code:asgCode,teacherId:subjects[asgCode].teacherId,title:atitle,instructions:'',type:val('aType'),dueDate:val('aDue'),points:+val('aPts')||100,link:val('aLink'),createdAt:Date.now(),year:currentYearId||null};
    var naid=uid();assignments[naid]=na;put('assignments/'+naid,clone(na));
    document.getElementById('aTitle').value='';document.getElementById('aLink').value='';banner='';render();return}
  if(act==='asgStatus'){var asid=t.dataset.sid,aaid=t.dataset.aid,aa=assignments[aaid];if(!aa||!canEditSub(aa.code))return;setAssignmentMark(asid,aa.code,aa,t.dataset.state,null);draw();return}
  if(act==='report'){sel=t.dataset.id;report=t.dataset.id;tab='students';banner='';draw();window.scrollTo(0,0);return}
  if(act==='print'){try{window.print()}catch(e){banner='Printing is not available here. Use your browser menu to print or save as PDF.';draw()}return}
  if(act==='dlReport'){dlReport(report);return}

  /* ---- academic years: admin only ---- */
  if(act==='firstYear'){if(!isAdmin)return;var lbl=val('yLabel');if(!lbl)return;
    var yid=uid(),yobj={label:lbl,startDate:val('yStart'),endDate:val('yEnd')};
    years[yid]=yobj;put('years/'+yid,clone(yobj));currentYearId=yid;put('config/currentYear',{yearId:yid});
    logActivity('year','Set up first year: '+lbl);
    document.getElementById('yLabel').value='';render();return}
  if(act==='startYear'){
    if(!isAdmin)return;
    var lbl2=val('yLabel');if(!lbl2)return;
    var clearSubs=confirm('Start "'+lbl2+'" as the new current year?\n\nOK also clears every student\u2019s subject list, so they start the new year unenrolled from last year\u2019s subjects (name, class and contact info stay the same). Cancel just creates the year without clearing anything.');
    var yid2=uid(),yobj2={label:lbl2,startDate:val('yStart'),endDate:val('yEnd')};
    years[yid2]=yobj2;put('years/'+yid2,clone(yobj2));currentYearId=yid2;put('config/currentYear',{yearId:yid2});
    if(clearSubs)Object.keys(roster).forEach(function(sid){if((roster[sid].subjects||[]).length){var s=clone(roster[sid]);s.subjects=[];roster[sid]=s;put('roster/'+sid,s)}});
    logActivity('year','Started new year: '+lbl2+(clearSubs?' (cleared subject lists)':''));
    document.getElementById('yLabel').value='';render();return}
  if(act==='setYear'){if(!isAdmin)return;var syid=t.dataset.id;logActivity('year','Switched current year to '+((years[syid]||{}).label||syid));currentYearId=syid;put('config/currentYear',{yearId:syid});render();return}
  if(act==='tagLegacy'){
    if(!isAdmin||!currentYearId)return;
    if(!confirm('Tag every untagged grade and absence, for subjects with a teacher currently assigned, as '+years[currentYearId].label+'? This can\u2019t be undone.'))return;
    Object.keys(entries).forEach(function(tid){
      Object.keys(entries[tid]).forEach(function(key){
        var en=clone(entries[tid][key]),changed=false;
        (en.grades||[]).forEach(function(g){if(!g.year){g.year=currentYearId;changed=true}});
        (en.absences||[]).forEach(function(a){if(!a.year){a.year=currentYearId;changed=true}});
        if(changed){entries[tid][key]=en;put('marks/'+tid+'/entries/'+key,clone(en))}
      });

  /* ---- access & roles: admin only, never delegable ---- */
  if(act==='addAllowed'){if(!isAdmin)return;var em=val('newEmail').toLowerCase();if(!em||em.indexOf('@')<0){banner='Enter a valid email address.';draw();return}

  if(act==='delAllowed'){if(!isAdmin)return;var em2=t.dataset.email;if(em2===myEmail)return;if(confirm('Remove access for '+em2+'?')){logActivity('access','Removed '+em2+' from the allowed list');delete allowed[em2];del('allowed_emails/'+em2);render()}return}
  if(act==='openAccount'){if(!isAdmin)return;accOpen=(accOpen===t.dataset.id)?null:t.dataset.id;draw();return}

  /* ---- students ---- */
  if(act==='enr'){if(!can('students'))return;var epick=document.getElementById('enrPick');if(!epick||!epick.value)return;var es=roster[sel],elist=(es.subjects||[]).slice();if(elist.indexOf(epick.value)<0){elist.push(epick.value);es.subjects=elist;saveRoster(sel);render()}return}
  if(act==='unenr'){if(!can('students'))return;var us=roster[sel],ulist=(us.subjects||[]).slice(),uix=ulist.indexOf(code);if(uix>-1){ulist.splice(uix,1);us.subjects=ulist;saveRoster(sel);render()}return}

  if(act==='delStudent'){if(!can('students'))return;if(confirm('Delete '+(roster[sel].name||'this student')+'?')){var d=sel;logActivity('delete','Deleted student '+(roster[d].name||d));delete roster[d];del('roster/'+d);sel=null;render()}return}

  /* ---- roll call / grading: owner of the subject, or admin ---- */
  if(!isAdmin&&!canEditSub(code))return;
  if(act==='pickLesson'){rcCode=t.dataset.code;draw();return}

  if(act==='rcAll'){Object.keys(roster).forEach(function(rid){if(enrolled(rid).indexOf(code)<0)return;var ve=validEntry(rid,code);if(ve&&(ve.absences||[]).some(function(a){return a.date===rcDate}))mutateEntry(rid,code,function(en){en.absences=en.absences.filter(function(a){return a.date!==rcDate})})});return}

  if(act==='addAbsence'){var dt=val('ad-'+code);if(!dt)return;var ab={id:uid(),date:dt,note:val('an-'+code),excused:document.getElementById('ae-'+code).checked,year:currentYearId||null};

app.addEventListener('change',function(e){

    breaks=breaks.map(function(b,idx){if(idx!==bi)return b;var nb=clone(b);nb[bk]=bv;return nb});
    put('config/breaks',{list:clone(breaks)});render();return}
  if(t.id==='schLevel'){schLevel=t.value;draw();return}
  if(t.dataset.sch!=null){if(!can('schedule'))return;var g=clone((schedules[schLevel]&&schedules[schLevel].grid)||{});g[t.dataset.sch]=t.value;schedules[schLevel]=schedules[schLevel]||{};schedules[schLevel].grid=g;put('schedules/'+schLevel,{grid:g});render();return}
  if(t.dataset.role!=null){
    if(!isAdmin)return;
    var ruid=t.dataset.role,newRole=t.value;
    if(newRole==='admin'){put('admins/'+ruid,{name:tname(ruid)});del('roles/'+ruid)}
    else if(newRole==='management'){del('admins/'+ruid);put('roles/'+ruid,{role:'management',perms:(roles[ruid]&&roles[ruid].perms)||{}})}
    else{del('admins/'+ruid);del('roles/'+ruid)}
    logActivity('role','Set '+tname(ruid)+'\u2019s role to '+newRole);
    render();return}
  if(t.dataset.perm!=null){
    if(!isAdmin)return;
    var puid=t.dataset.perm,pk=t.dataset.k,pv=t.checked;
    var cur=clone(roles[puid]||{role:'management',perms:{}});cur.role='management';cur.perms=cur.perms||{};cur.perms[pk]=pv;
    roles[puid]=cur;put('roles/'+puid,cur);logActivity('perm',(pv?'Gave ':'Took away ')+tname(puid)+'\u2019s \u201c'+(PERM_LABELS[pk]||pk)+'\u201d permission');render();return}
  if(!can('students')||!sel||!roster[sel])return;
  var s=roster[sel];
  if(t.dataset.f){s[t.dataset.f]=t.value.trim()}
  else return;
  saveRoster(sel);render();
});
app.addEventListener('input',function(e){
  if(e.target.id==='search'){filter=e.target.value;draw()}
  if(e.target.id==='tq')runSearch(e.target.value);
  if(e.target.id==='cq')runSearchCls(e.target.value);
});
function runSearch(q){
  var box=document.getElementById('tres');if(!box)return;
  box.textContent='';
  var hits=Object.keys(names).filter(function(id){return !q||(names[id].name||'').toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return (names[a].name||'').localeCompare(names[b].name||'')});
  if(!hits.length){var p=document.createElement('p');p.className='mut';p.textContent=q?'No matches.':'No one has signed in yet.';box.appendChild(p);return}
  hits.forEach(function(id){var b=document.createElement('button');b.dataset.act='pickTeacher';b.dataset.pid=id;b.textContent=names[id].name||names[id].email||id;box.appendChild(b)});
}
function openPicker(){var q=document.getElementById('tq');if(q){q.focus();runSearch('')}}
document.getElementById('csv').onclick=function(){
  var rows=[['Name','Class','Subject code','Subject average %','Overall average %','Absences','Unexcused absences']];
  Object.keys(roster).sort(function(a,b){return (roster[a].name||'').localeCompare(roster[b].name||'')}).forEach(function(id){
    var s=roster[id],o=overall(id),en=enrolled(id);if(!en.length)en=[''];
    en.forEach(function(c){var v=c?subjectAvg(id,c):null;rows.push([s.name,s.level,c,v==null?'':v.toFixed(1),o==null?'':o.toFixed(1),absTotal(id),absTotal(id,true)])})});
  var csv=rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);if(/^[=+\-@]/.test(c))c="'"+c;return '"'+c.replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  saveFile('class-summary.csv',csv,'text/csv;charset=utf-8');
};
init();
})();
</script>
